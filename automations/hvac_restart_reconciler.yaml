alias: HVAC Restart Reconciler
description: >-
  After Home Assistant starts, repairs whatever a restart can leave stale.
  Recomputes the season and plan and re-applies them (script.hvac_restart_recalc),
  and if the windows were marked open, re-arms the close reminder so a
  reminder time left in the past can never strand the thermostat off.
triggers:
  - trigger: homeassistant
    event: start
actions:
  - action: script.turn_on
    target:
      entity_id: script.hvac_restart_recalc
    note: >-
      script.turn_on starts the recalculation without waiting for it, so this
      automation is not blocked while the script waits for integrations.
  - if:
      - condition: state
        entity_id: input_boolean.hvac_windows_open
        state: "on"
    then:
      - action: script.hvac_window_arm_close
        continue_on_error: true
        note: The weather integration may still be loading. A failed scan must not stop the rest.
mode: single
