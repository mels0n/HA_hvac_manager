alias: HVAC Manual Hold
description: >-
  When someone changes the thermostat at the wall or in its own app, honor it:
  turn on input_boolean.hvac_manual_hold so script.hvac_apply_plan stops
  overriding it, until the next schedule boundary (05:00, 07:30 or 21:30)
  clears the hold. Changes made by Home Assistant itself are ignored.
triggers:
  - trigger: state
    entity_id: climate.thermostat
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
conditions:
  - condition: template
    value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
    note: Only a mode change counts. Setpoint and attribute updates arrive as state writes too.
  - condition: template
    value_template: "{{ trigger.to_state.context.parent_id is none and trigger.to_state.context.user_id is none }}"
    note: >-
      This is how a change made outside Home Assistant is told apart. An
      automation or script sets context.parent_id, and the dashboard or an API
      user sets context.user_id. A wall or vendor-app change sets neither.
  - condition: state
    entity_id: input_boolean.hvac_windows_open
    state: "off"
  - condition: state
    entity_id: input_boolean.hvac_manual_hold
    state: "off"
actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hvac_manual_hold
  - action: script.hvac_message_send
    data:
      message: "Thermostat changed at the wall or in its app to {{ trigger.to_state.state }}. Honoring it until the next schedule boundary (5:00, 7:30 or 21:30)."
mode: single
